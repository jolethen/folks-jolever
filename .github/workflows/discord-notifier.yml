name: Discord Notifier

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"username\": \"GitHub\", \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\", \"content\": \"🚀 **New commit pushed to main!**\\nRepository: \`${{ github.repository }}\`\\nCommit by: ${{ github.actor }}\\nMessage: ${{ github.event.head_commit.message }}\"}" \
          $WEBHOOK_URL
